<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Djwar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0a0816; --panel:#15112b; --line:#2c2552; --text:#efeaff; --muted:#9a90c8;
  --cyan:#2ef2ff; --pink:#ff3cac; --amber:#ffc53d; --lime:#7dff6b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Chakra Petch","Segoe UI",Tahoma,system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(60% 50% at 20% 0%,#2a1450 0%,transparent 70%),radial-gradient(50% 45% at 100% 100%,#0b2f4a 0%,transparent 70%);
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px clamp(12px,3vw,28px);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:.04em;direction:ltr;
  color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 28px #2ef2ff66}
.brand b{color:var(--pink);text-shadow:0 0 12px var(--pink),0 0 28px #ff3cac66}
.hud{display:flex;gap:clamp(12px,3vw,32px);align-items:center}
.stat{display:flex;flex-direction:column;align-items:center;min-width:56px}
.stat span{font-size:.75rem;color:var(--muted)}
.stat strong{font-size:1.45rem;font-variant-numeric:tabular-nums;direction:ltr}
#time.low{color:var(--pink);text-shadow:0 0 10px var(--pink)}
.lives{display:flex;gap:6px;direction:ltr}
.lives i{width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);transition:.2s}
.lives i.off{background:transparent;box-shadow:none;border:1px solid var(--line)}
#mute{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit}
main{flex:1;min-height:0;position:relative;padding:clamp(8px,2vw,20px)}
#stage{position:relative;width:100%;height:100%;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:#0d0a1f;box-shadow:inset 0 0 60px #1d0f4a88,0 0 40px #2ef2ff14}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;background:#0a0816d9;backdrop-filter:blur(6px)}
.overlay[hidden]{display:none}
.overlay h1{margin:0;font-size:clamp(2.2rem,7vw,4.4rem);direction:ltr;letter-spacing:.03em;
  color:var(--cyan);text-shadow:0 0 18px var(--cyan),0 0 50px #2ef2ff88}
.overlay h1 b{color:var(--pink);text-shadow:0 0 18px var(--pink),0 0 50px #ff3cac88}
.overlay p{margin:0;color:var(--muted);max-width:42ch;line-height:1.8}
.big{font-size:clamp(2.6rem,9vw,5rem);font-weight:700;color:var(--amber);text-shadow:0 0 22px #ffc53d88;direction:ltr}
.badge{color:var(--lime);font-weight:700;text-shadow:0 0 12px #7dff6b88}
.btn{
  font:inherit;font-weight:700;font-size:1.15rem;color:#0a0816;background:var(--cyan);
  border:0;border-radius:14px;padding:14px 38px;cursor:pointer;
  box-shadow:0 0 22px #2ef2ff99,0 0 60px #2ef2ff44;transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:scale(1.05)}
.btn:focus-visible,#mute:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (max-width:560px){header{justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>DJWAR</b></div>
  <div class="hud" aria-live="off">
    <div class="stat"><span>خاڵ</span><strong id="score">0</strong></div>
    <div class="stat"><span>باشترین خاڵ</span><strong id="best">0</strong></div>
    <div class="stat"><span>دەم</span><strong id="time">60</strong></div>
    <div class="stat"><span>ژیان</span><div class="lives" id="lives"><i></i><i></i><i></i></div></div>
    <button id="mute" type="button" aria-pressed="false">🔊</button>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>

    <section class="overlay" id="start">
      <h1><b>DJWAR</b></h1>
      <p>ئامانجێن نیۆنی دێ دیار بن و زوی ژ ناڤ چن. ب ماوسێ کلیک ل سەر بکە پێش کو وندا ببن. هەر چەند خاڵ زێدەتر بن، یاری خێراتر دبیت.</p>
      <p>٦٠ چرکە و ٣ ژیان هەنە. ئەگەر ئامانجەک ژ دەست بچیت، ژیانەک دێ کێم بیت.</p>
      <button class="btn" id="play" type="button">یاری بکە</button>
    </section>

    <section class="overlay" id="over" hidden>
      <p id="why"></p>
      <div class="big" id="final">0</div>
      <p id="record" class="badge" hidden>ڕێکۆردێ نوی!</p>
      <p>باشترین خاڵ: <span id="finalBest" dir="ltr">0</span></p>
      <button class="btn" id="again" type="button">یاری ژ نوو</button>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const scoreEl = $('score'), bestEl = $('best'), timeEl = $('time'), livesEl = $('lives').children;
  const COLORS = ['#2ef2ff', '#ff3cac', '#ffc53d', '#7dff6b'];
  const GAME_SECONDS = 60, MAX_LIVES = 3, KEY = 'neonReflexBest';

  // ---------- High score (localStorage, always guarded) ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem(KEY, String(best)); } catch (e) {} };
  bestEl.textContent = best;

  // ---------- Sound (Web Audio) ----------
  let ac = null, muted = false;
  function tone(freq, dur = 0.12, type = 'sine', vol = 0.12, slide = 0) {
    if (muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    hit: combo => tone(520 + Math.min(combo, 20) * 28, 0.11, 'triangle', 0.14, 260),
    miss: () => tone(200, 0.3, 'sawtooth', 0.1, -120),
    click: () => tone(140, 0.07, 'square', 0.05),
    start: () => { tone(440, .1, 'square', .08); setTimeout(() => tone(660, .14, 'square', .08), 100); },
    over: () => { tone(440, .2, 'sine', .12, -200); setTimeout(() => tone(260, .45, 'sine', .12, -120), 200); },
    record: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .16, 'triangle', .12), i * 110))
  };
  $('mute').onclick = () => {
    muted = !muted;
    $('mute').textContent = muted ? '🔇' : '🔊';
    $('mute').setAttribute('aria-pressed', muted);
  };

  // ---------- Canvas sizing ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- State ----------
  let running = false, score, timeLeft, lives, combo, targets, parts, rings, spawnAcc, last;

  function reset() {
    score = 0; timeLeft = GAME_SECONDS; lives = MAX_LIVES; combo = 0;
    targets = []; parts = []; rings = []; spawnAcc = 0.3;
    updateHud();
  }
  const level = () => Math.min(1 + score / 150, 3.5);   // faster as score grows
  const mult = () => Math.min(1 + Math.floor(combo / 5), 5);

  function updateHud() {
    scoreEl.textContent = score;
    timeEl.textContent = Math.ceil(timeLeft);
    timeEl.classList.toggle('low', timeLeft <= 10);
    for (let i = 0; i < MAX_LIVES; i++) livesEl[i].classList.toggle('off', i >= lives);
  }

  function spawn() {
    const lv = level();
    const r = Math.max(26, 54 - lv * 5) * (0.8 + Math.random() * 0.4);
    const pad = r + 12;
    targets.push({
      x: pad + Math.random() * (W - pad * 2),
      y: pad + Math.random() * (H - pad * 2),
      r, born: 0, life: Math.max(1, 2.8 - lv * 0.35),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      pts: Math.round(10 + Math.max(0, 50 - r) / 3)
    });
  }

  function burst(x, y, color, n = 16) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, t: 0, color });
    }
    rings.push({ x, y, color, t: 0 });
  }

  // ---------- Loop ----------
  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    timeLeft -= dt;
    spawnAcc -= dt;
    if (spawnAcc <= 0) { spawn(); spawnAcc = Math.max(0.5, 1.4 - level() * 0.2) * (0.7 + Math.random() * 0.6); }

    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i]; t.born += dt;
      if (t.born >= t.life) {
        targets.splice(i, 1); lives--; combo = 0; sfx.miss();
        rings.push({ x: t.x, y: t.y, color: '#ff3c5a', t: 0 });
      }
    }
    parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; });
    parts = parts.filter(p => p.t < p.life);
    rings.forEach(r => r.t += dt);
    rings = rings.filter(r => r.t < 0.4);

    updateHud();
    draw();
    if (lives <= 0) return end('هەمی ژیان ب دوماهی هاتن');
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); return end('دەم ب دوماهی هات'); }
    requestAnimationFrame(frame);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // faint grid
    ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    for (const t of targets) {
      const k = 1 - t.born / t.life;              // 1 → 0
      const pop = Math.min(t.born / 0.12, 1);     // quick appear
      const r = t.r * pop;
      ctx.save();
      ctx.shadowColor = t.color; ctx.shadowBlur = 26;
      ctx.fillStyle = t.color + '33';
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = t.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, 7); ctx.stroke();
      // remaining-time ring
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(t.x, t.y, r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.22, 0, 7); ctx.fill();
      ctx.restore();
    }
    for (const r of rings) {
      ctx.strokeStyle = r.color; ctx.globalAlpha = 1 - r.t / 0.4; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.t * 220, 0, 7); ctx.stroke();
    }
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 10;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    if (combo >= 5) {
      ctx.fillStyle = '#ffc53d'; ctx.font = '700 22px "Chakra Petch", sans-serif'; ctx.textAlign = 'left';
      ctx.shadowColor = '#ffc53d'; ctx.shadowBlur = 14;
      ctx.fillText('x' + mult() + '  combo ' + combo, 16, H - 18);
      ctx.shadowBlur = 0;
    }
  }

  // ---------- Input ----------
  cv.addEventListener('pointerdown', e => {
    if (!running) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    // hit the closest (newest-first) target under the pointer
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (Math.hypot(x - t.x, y - t.y) <= t.r + 8) {
        combo++;
        score += t.pts * mult();
        targets.splice(i, 1);
        burst(t.x, t.y, t.color);
        sfx.hit(combo);
        scoreEl.textContent = score;
        return;
      }
    }
    combo = 0; sfx.click();   // clicked empty space
  });

  // ---------- Flow ----------
  function begin() {
    reset(); resize();
    $('start').hidden = true; $('over').hidden = true;
    sfx.start();
    running = true; last = performance.now();
    requestAnimationFrame(frame);
  }
  function end(reason) {
    running = false;
    const isRecord = score > best && score > 0;
    if (isRecord) { best = score; saveBest(); bestEl.textContent = best; }
    $('why').textContent = reason;
    $('final').textContent = score;
    $('finalBest').textContent = best;
    $('record').hidden = !isRecord;
    $('over').hidden = false;
    $('again').focus();
    isRecord ? sfx.record() : sfx.over();
  }

  $('play').onclick = begin;
  $('again').onclick = begin;
  document.addEventListener('keydown', e => {
    if (!running && (e.key === 'Enter' || e.key === ' ')) {
      const btn = !$('over').hidden ? $('again') : $('play');
      if (document.activeElement !== btn) { e.preventDefault(); begin(); }
    }
  });

  resize();
  reset();
})();
</script>
</body>
</html>
